services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sciconnectspa
      - identityservice
      - db.api
      - analyticsservice

  identityservice:
    container_name: identityservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - "ConnectionStrings:IdentityConnectionString=Server=mssql;Database=IdentityDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      - "EventBusSettings:HostAddress=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      - "CacheSettings:ConnectionString=redis:6379"
      - "JwtSettings:validIssuer=SciConnect Identity"
      - "JwtSettings:validAudience=SciConnect"
      - "JwtSettings:secretKey=${JWT_SECRET_KEY}"
      - "JwtSettings:expires=15"
      - "RefreshTokenExpires=30"
      - "PMSettings:RegistrationPassword=${PM_REGISTRATION_PASSWORD}"
      - EmailSettings__From=${EMAIL_FROM}
      - EmailSettings__DisplayName=${EMAIL_DISPLAY_NAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__SmtpServer=${EMAIL_SMTP_SERVER}
      - EmailSettings__Port=${EMAIL_PORT}
      - EmailSettings__UseSSL=false
      - EmailSettings__UseStartTls=true
      - "AllowedOrigins=https://${SERVER_IP},http://${SERVER_IP}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: mssql
    restart: always
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    volumes:
      - mssql_data:/var/opt/mssql/data
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "1433"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: always
    expose:
      - "5672"
      - "15672"

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    expose:
      - "6379"

  db.api:
    container_name: mainservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - "ConnectionStrings:EntityConnectionString=Server=mssql;Database=EntityDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      - "EventBusSettings:HostAddress=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      - "JwtSettings:validIssuer=SciConnect Identity"
      - "JwtSettings:validAudience=SciConnect"
      - "JwtSettings:secretKey=${JWT_SECRET_KEY}"
      - "AllowedOrigins=https://${SERVER_IP},http://${SERVER_IP}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

  sciconnectspa:
    container_name: sciconnect-frontend
    environment:
      - NODE_ENV=production
      - API_DB_URL=https://api-db.${SERVER_IP}/api/v1/db
      - API_IDENTITY_URL=https://api-identity.${SERVER_IP}/api/v1/identity
      - API_ANALYTICS_URL=https://api-analytics.${SERVER_IP}/api/v1/analytics
    depends_on:
      - db.api
      - identityservice
    expose:
      - "4000"
    restart: unless-stopped

  analyticsservice:
    container_name: analyticsservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - "ConnectionStrings:DefaultConnection=Server=mssql;Database=EntityDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      - "EventBusSettings:HostAddress=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      - "JwtSettings:validIssuer=SciConnect Identity"
      - "JwtSettings:validAudience=SciConnect"
      - "JwtSettings:secretKey=${JWT_SECRET_KEY}"
      - "AllowedOrigins=https://${SERVER_IP},http://${SERVER_IP}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
