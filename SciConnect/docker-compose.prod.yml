services:
  identityservice:
    image: ${DOCKER_REGISTRY-}identityservice
    build:
      context: .
      dockerfile: IdentityServer/IdentityService/Dockerfile
    container_name: identityservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings:IdentityConnectionString=${IDENTITY_CONNECTION_STRING}
      - EventBusSettings:HostAddress=${RABBITMQ_HOST}
      - CacheSettings:ConnectionString=${REDIS_CONNECTION_STRING}
      - JwtSettings__validIssuer=${JWT_VALID_ISSUER}
      - JwtSettings__validAudience=${JWT_VALID_AUDIENCE}
      - JwtSettings__secretKey=${JWT_SECRET_KEY}
      - JwtSettings__expires=${JWT_EXPIRES}
      - RefreshTokenExpires=${REFRESH_TOKEN_EXPIRES}
      - PMSettings__RegistrationPassword=${PM_REGISTRATION_PASSWORD}
      - EmailSettings__From=${EMAIL_FROM}
      - EmailSettings__DisplayName=${EMAIL_DISPLAY_NAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__SmtpServer=${EMAIL_SMTP_SERVER}
      - EmailSettings__Port=${EMAIL_PORT}
      - EmailSettings__UseSSL=${EMAIL_USE_SSL}
      - EmailSettings__UseStartTls=${EMAIL_USE_STARTTLS}
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - sciconnect-network

  mssql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      - SA_PASSWORD=${DB_SA_PASSWORD}
      - ACCEPT_EULA=Y
    volumes:
      - mssql_data:/var/opt/mssql/data
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${DB_SA_PASSWORD} -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sciconnect-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sciconnect-network

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - sciconnect-network

  db.api:
    image: ${DOCKER_REGISTRY-}dbapi
    build:
      context: .
      dockerfile: Services/DB/DB.API/DB.API/Dockerfile
    container_name: mainservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:EntityConnectionString=${ENTITY_CONNECTION_STRING}
      - EventBusSettings:HostAddress=${RABBITMQ_HOST}
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - sciconnect-network

  sciconnectspa:
    image: ${DOCKER_REGISTRY-}sciconnectspa
    build:
      context: ./WebApps/SciConnectSPA
      dockerfile: Dockerfile
    container_name: sciconnect-frontend
    environment:
      - NODE_ENV=production
    depends_on:
      - db.api
      - identityservice
    restart: unless-stopped
    networks:
      - sciconnect-network

  analyticsservice:
    image: ${DOCKER_REGISTRY-}analyticsservice
    build:
      context: .
      dockerfile: AnalyticsService/Dockerfile
    container_name: analyticsservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings:DefaultConnection=${ENTITY_CONNECTION_STRING}
      - EventBusSettings:HostAddress=${RABBITMQ_HOST}
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - sciconnect-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - sciconnectspa
      - db.api
      - identityservice
      - analyticsservice
    networks:
      - sciconnect-network

volumes:
  mssql_data:
  rabbitmq_data:
  redis_data:

networks:
  sciconnect-network:
    driver: bridge
